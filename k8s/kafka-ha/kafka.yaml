apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: spring-boot-lab
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka-ha
  ports:
    - name: internal
      port: 29092
      targetPort: internal
    - name: controller
      port: 9093
      targetPort: controller

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: spring-boot-lab
spec:
  selector:
    app: kafka-ha
  ports:
    - name: internal
      port: 29092
      targetPort: internal

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: spring-boot-lab
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel

  selector:
    matchLabels:
      app: kafka-ha

  template:
    metadata:
      labels:
        app: kafka-ha

    spec:
      terminationGracePeriodSeconds: 60

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: kafka-ha
              topologyKey: kubernetes.io/hostname

      containers:
        - name: kafka
          image: apache/kafka:4.1.2
          imagePullPolicy: IfNotPresent

          command:
            - /bin/bash
            - -ec
            - |
              ORDINAL="${HOSTNAME##*-}"
              NODE_ID="$((ORDINAL + 1))"

              export KAFKA_NODE_ID="$NODE_ID"

              export KAFKA_ADVERTISED_LISTENERS="INTERNAL://${HOSTNAME}.kafka-headless.spring-boot-lab.svc.cluster.local:29092"

              exec /etc/kafka/docker/run

          env:
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"

            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: >-
                1@kafka-0.kafka-headless.spring-boot-lab.svc.cluster.local:9093,
                2@kafka-1.kafka-headless.spring-boot-lab.svc.cluster.local:9093,
                3@kafka-2.kafka-headless.spring-boot-lab.svc.cluster.local:9093

            - name: KAFKA_LISTENERS
              value: "INTERNAL://:29092,CONTROLLER://:9093"

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"

            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"

            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"

            - name: KAFKA_NUM_PARTITIONS
              value: "3"

            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"

            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"

          ports:
            - name: internal
              containerPort: 29092

            - name: controller
              containerPort: 9093

          startupProbe:
            tcpSocket:
              port: internal
            failureThreshold: 60
            periodSeconds: 5

          readinessProbe:
            tcpSocket:
              port: internal
            failureThreshold: 6
            periodSeconds: 5
            timeoutSeconds: 2

          livenessProbe:
            tcpSocket:
              port: internal
            failureThreshold: 4
            periodSeconds: 15
            timeoutSeconds: 2

          resources:
            requests:
              cpu: 150m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi

          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
