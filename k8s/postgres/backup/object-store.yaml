apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-ha-backup
  namespace: spring-boot-lab
spec:
  retentionPolicy: "7d"

  configuration:
    destinationPath: s3://postgres-backups/
    endpointURL: http://phase4-minio:9000

    s3Credentials:
      accessKeyId:
        name: phase4-minio
        key: ACCESS_KEY_ID

      secretAccessKey:
        name: phase4-minio
        key: ACCESS_SECRET_KEY

    wal:
      compression: gzip
