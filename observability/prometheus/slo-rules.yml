groups:
  - name: spring-boot-service-level-indicators
    interval: 30s
    rules:
      - record: service:http_request_rate:rate5m
        expr: >-
          sum(rate(http_server_requests_seconds_count{job="spring-boot-ecommerce-backend"}[5m]))

      - record: service:http_5xx_ratio:rate5m
        expr: >-
          sum(rate(http_server_requests_seconds_count{job="spring-boot-ecommerce-backend",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="spring-boot-ecommerce-backend"}[5m])), 0.001)

      - record: service:http_5xx_ratio:rate30m
        expr: >-
          sum(rate(http_server_requests_seconds_count{job="spring-boot-ecommerce-backend",status=~"5.."}[30m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="spring-boot-ecommerce-backend"}[30m])), 0.001)

      - record: service:http_5xx_ratio:rate1h
        expr: >-
          sum(rate(http_server_requests_seconds_count{job="spring-boot-ecommerce-backend",status=~"5.."}[1h]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="spring-boot-ecommerce-backend"}[1h])), 0.001)

      - record: service:http_5xx_ratio:rate6h
        expr: >-
          sum(rate(http_server_requests_seconds_count{job="spring-boot-ecommerce-backend",status=~"5.."}[6h]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="spring-boot-ecommerce-backend"}[6h])), 0.001)

      - record: service:http_availability:rate5m
        expr: 1 - service:http_5xx_ratio:rate5m

      - record: service:http_latency_p95_seconds:rate5m
        expr: >-
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_server_requests_seconds_bucket{job="spring-boot-ecommerce-backend"}[5m])
            )
          )
