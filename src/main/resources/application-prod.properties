# Production: conservative retry and timeout settings
outbox.publisher.max-attempts=10
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.retries=3

# Production hardening
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=false

# Production observability
management.opentelemetry.enabled=${OTEL_ENABLED:true}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.10}
logging.structured.format.console=logstash
logging.structured.json.stacktrace.root=first
logging.structured.json.stacktrace.max-length=4096
logging.structured.json.stacktrace.include-hashes=true

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
