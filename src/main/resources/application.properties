spring.application.name=spring-boot-lab
spring.profiles.default=local

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=ecommerce-event-consumer-v2
spring.kafka.consumer.auto-offset-reset=earliest


# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=900000
refresh-token.expiration-days=30
payment.idempotency.retention-hours=24

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Spring Boot E-Commerce Backend
info.app.description=Production-oriented e-commerce backend with JWT, Redis, Kafka, Docker, and CI
info.app.version=1.0.0

# Event retention cleanup
event.retention.processed-events-days=30
event.retention.order-event-audit-days=90
event.retention.cleanup.fixed-delay-ms=86400000
event.retention.cleanup.initial-delay-ms=86400000

# Prometheus HTTP latency histograms for Grafana P95/P99
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.95,0.99

# Trace and correlation defaults
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.10}
management.opentelemetry.enabled=${OTEL_ENABLED:false}
management.otlp.metrics.export.enabled=false
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]
logging.include-application-name=false

# Dead-letter replay lease recovery
dlt.replay.lease-seconds=60
dlt.replay.recovery.fixed-delay-ms=30000
dlt.replay.recovery.initial-delay-ms=30000

# Graceful shutdown preserves in-flight HTTP and messaging work
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

management.endpoint.health.probes.enabled=true
